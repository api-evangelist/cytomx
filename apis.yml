name: CytomX Therapeutics
description: >-
  CytomX Therapeutics is a clinical-stage, oncology-focused biopharmaceutical
  company based in South San Francisco, California, pioneering a novel class of masked,
  conditionally activated biologic therapeutics built on its proprietary Probody platform.
  The Probody technology is engineered to remain inactive in healthy tissue and to
  become selectively unmasked and activated within the tumor microenvironment, with
  the goal of producing more potent, less toxic cancer medicines. The company's
  pipeline spans antibody-drug conjugates (ADCs), T-cell engaging bispecific antibodies,
  and immunotherapies, advanced both internally and through partnerships with major
  pharmaceutical companies. CytomX is a publicly traded company (Nasdaq CTMX). This
  API Evangelist profile was surfaced as a portfolio company of Canaan Partners; as
  a biopharmaceutical research organization CytomX does not publish a public developer
  API, so this profile carries company identity and domain-security posture rather
  than API artifacts.
